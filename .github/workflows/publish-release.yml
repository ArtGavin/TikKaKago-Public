name: Publish Release (Public host)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version + paths
        id: meta
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.0.38
          VER="${TAG#v}"                    # e.g. 1.0.38
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ver=$VER" >> $GITHUB_OUTPUT

          ZIP1="release/TikKaKago_update.zip"
          ZIP2="TikKaKago_update.zip"

          if [ -f "$ZIP1" ]; then
            echo "zip=$ZIP1" >> $GITHUB_OUTPUT
          elif [ -f "$ZIP2" ]; then
            echo "zip=$ZIP2" >> $GITHUB_OUTPUT
          else
            echo "❌ Cannot find TikKaKago_update.zip"
            echo "Expected: $ZIP1 or $ZIP2"
            exit 1
          fi

      - name: Create manifest.json for Release asset
        id: manifest
        shell: bash
        run: |
          set -e
          VER="${{ steps.meta.outputs.ver }}"
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="${GITHUB_REPOSITORY}"  # ArtGavin/TikKaKago-Public

          # ✅ ใช้ latest/download (เข้ากับ updater ของคุณ)
          ZIP_URL="https://github.com/${REPO}/releases/latest/download/TikKaKago_update.zip"

          cat > manifest.json <<EOF
          {
            "ok": true,
            "latest": "${VER}",
            "min_supported": "${VER}",
            "force": true,
            "download_url": "${ZIP_URL}",
            "notes": "Release ${VER}"
          }
          EOF

          echo "manifest=manifest.json" >> $GITHUB_OUTPUT

      - name: Create GitHub Release + upload assets (zip + manifest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.zip }}
            ${{ steps.manifest.outputs.manifest }}

      - name: Update shared/version.json (legacy / optional)
        shell: bash
        run: |
          set -e
          VER="${{ steps.meta.outputs.ver }}"
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="${GITHUB_REPOSITORY}"  # ArtGavin/TikKaKago-Public

          mkdir -p shared

          # อันนี้ยังคงเดิมไว้ (เผื่อคุณยังมีโค้ดบางส่วนอ่าน shared/version.json)
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/TikKaKago_update.zip"

          cat > shared/version.json <<EOF
          {
            "latest": "${VER}",
            "current": "${VER}",
            "min_supported": "${VER}",
            "force": true,
            "download_url": "${DOWNLOAD_URL}",
            "notes": "Release ${VER}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shared/version.json
          git commit -m "chore: update manifest ${VER}" || echo "No changes to commit"
          git push origin HEAD:main
