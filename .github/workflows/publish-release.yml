name: Publish Release (Public host)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version + paths
        id: meta
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.0.38
          VER="${TAG#v}"                    # e.g. 1.0.38
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ver=$VER" >> $GITHUB_OUTPUT

          ZIP1="release/TikKaKago_update.zip"
          ZIP2="TikKaKago_update.zip"

          if [ -f "$ZIP1" ]; then
            echo "zip=$ZIP1" >> $GITHUB_OUTPUT
          elif [ -f "$ZIP2" ]; then
            echo "zip=$ZIP2" >> $GITHUB_OUTPUT
          else
            echo "❌ Cannot find TikKaKago_update.zip"
            echo "Expected: $ZIP1 or $ZIP2"
            exit 1
          fi

      - name: Normalize asset name to TikKaKago_update.zip
        shell: bash
        run: |
          set -e
          cp "${{ steps.meta.outputs.zip }}" "./TikKaKago_update.zip"
          ls -lah "./TikKaKago_update.zip"

      - name: Create GitHub Release + upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            TikKaKago_update.zip

      # ✅ สำคัญ: ตอนนี้เราอยู่ที่ tag (detached HEAD)
      # ให้สลับไป main ก่อน แล้วค่อยแก้ manifest เพื่อให้ push main ชัวร์
      - name: Checkout main branch for manifest update
        shell: bash
        run: |
          set -e
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main origin/main

      - name: Update shared/version.json (manifest for updater) - UTF8 NO BOM
        shell: bash
        run: |
          set -e
          VER="${{ steps.meta.outputs.ver }}"
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="${GITHUB_REPOSITORY}"  # ArtGavin/TikKaKago-Public

          mkdir -p shared
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/TikKaKago_update.zip"

          python - <<'PY'
          import json, os
          ver = os.environ["VER"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          download_url = os.environ["DOWNLOAD_URL"]

          obj = {
            "latest": ver,
            "current": ver,
            "min_supported": ver,
            "force": True,
            "download_url": download_url,
            "notes": f"Release {tag}",
          }
          # ✅ utf-8 แบบไม่ใส่ BOM
          with open("shared/version.json", "w", encoding="utf-8", newline="\n") as f:
            json.dump(obj, f, ensure_ascii=False, indent=2)
            f.write("\n")
          PY
        env:
          VER: ${{ steps.meta.outputs.ver }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/TikKaKago_update.zip

      - name: Commit & push manifest to main
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add shared/version.json
          git commit -m "chore: update manifest ${{ steps.meta.outputs.ver }}" || echo "No changes to commit"
          git push origin main
